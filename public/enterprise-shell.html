<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Évora Enterprise</title>
<style>
:root{--green:#84C225;--blue:#245E82;--dark:#0E2738;--line:#DCE7EC;--bg:#F4F7F8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg)}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,var(--dark),#173C52);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);z-index:5}.brand{font-weight:950;margin-right:10px;white-space:nowrap}.nav{display:flex;gap:7px;overflow:auto}.nav button{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#fff;border-radius:11px;padding:9px 13px;font-weight:850;cursor:pointer;white-space:nowrap}.nav button.active{background:linear-gradient(135deg,var(--green),var(--blue));border-color:transparent}.status{margin-left:auto;font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap}.frame{width:100%;height:100%;border:0;background:white}@media(max-width:720px){body{grid-template-rows:104px 1fr}.bar{align-items:flex-start;flex-wrap:wrap}.status{display:none}.nav{width:100%}}
</style>
</head>
<body>
<header class="bar"><div class="brand">Évora Enterprise</div><nav class="nav"><button id="enterpriseBtn" class="active">Enterprise</button><button id="metaBtn">Meta Lead Ads</button></nav><div class="status" id="status">CRM + Meta integrados</div></header>
<iframe id="frame" class="frame" src="/index.html" title="Évora Enterprise"></iframe>
<script>
const frame=document.getElementById('frame'), enterpriseBtn=document.getElementById('enterpriseBtn'), metaBtn=document.getElementById('metaBtn');
function openView(view){const meta=view==='meta';frame.src=meta?'/enterprise-meta.html':'/index.html';enterpriseBtn.classList.toggle('active',!meta);metaBtn.classList.toggle('active',meta);history.replaceState(null,'',meta?'/?modulo=meta':'/');}
enterpriseBtn.onclick=()=>openView('enterprise');metaBtn.onclick=()=>openView('meta');
const q=new URLSearchParams(location.search);if(q.get('modulo')==='meta')openView('meta');
</script>
</body>
</html>
