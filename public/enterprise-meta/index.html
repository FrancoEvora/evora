<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Évora Enterprise · Meta Lead Ads</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#84C225;--b:#245E82;--d:#0E2738;--bg:#F4F7F8;--l:#DCE7EC;--m:#637887}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:var(--bg);color:#142B3A}.shell{max-width:1180px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--b));color:white;display:grid;place-items:center;font-size:24px;font-weight:900}.card{background:white;border:1px solid var(--l);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #173c5210}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--m);margin-bottom:6px}input,select{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:12px;background:white}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--g),var(--b));color:white}.secondary{background:#edf5ff;color:#245E82}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:var(--m)}.ok{color:#148A4A}.err{color:#B91C1C}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-weight:900;font-size:12px;background:#eef2f6}.pill.ok{background:#ecfdf3}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}.login{max-width:430px;margin:70px auto}@media(max-width:760px){.grid{grid-template-columns:1fr}.shell{padding:16px}}</style></head><body><div id="app"></div><script>
const URL='https://qsdffayasuzsmngteika.supabase.co',KEY='sb_publishable_nMCXNDXMvU0EbMSSmnEfQg_0uE_lVOW',API=URL+'/functions/v1/enterprise-meta-direct';const sb=supabase.createClient(URL,KEY);let session=null,discovery=null;
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function call(action,body){const r=await fetch(API+'?action='+action,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Falha');return j}
function login(){app.innerHTML='<div class="login card"><h2>Évora Enterprise</h2><p class="muted">Meta Lead Ads · acesso administrativo</p><div class="field"><label>E-mail</label><input id="em"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="pw" type="password"></div><button class="btn primary" id="go" style="margin-top:14px;width:100%">Entrar</button><div id="msg" class="err"></div></div>';go.onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error){msg.textContent=error.message;return}session=data.session;render()}}
async function render(){let st={};try{st=await call('status')}catch(e){}app.innerHTML=`<div class="shell"><div class="head"><div class="brand"><div class="mark">É</div><div><h2 style="margin:0">Évora Enterprise · Meta Lead Ads</h2><div class="muted">Conexão direta Meta → CRM</div></div></div><button class="btn secondary" id="out">Sair</button></div><div class="card"><div class="row"><strong>Status</strong><span class="pill ${st.connected?'ok':''}">${st.connected?'CONECTADO':'NÃO CONFIGURADO'}</span><span class="muted">Leads Meta no CRM: ${st.crm_meta_leads||0}</span></div></div><div class="card"><h3>1. Conectar e descobrir ativos</h3><div class="grid"><div class="field"><label>Access Token</label><input id="token" type="password" placeholder="Cole apenas para configurar; depois fica no Vault"></div><div class="field"><label>App ID</label><input id="appid" value="${esc(st.connection?.app_id||'1296933085661158')}"></div></div><div class="row" style="margin-top:14px"><button class="btn primary" id="discover">Conectar à Meta</button><span id="dmsg" class="muted"></span></div><div id="assets"></div></div><div class="card"><h3>2. Sincronização direta de leads</h3><p class="muted">O Enterprise lê todos os formulários da Página, cria/atualiza as rotas no CRM e ingere cada lead de forma idempotente.</p><div class="row" style="margin-top:14px"><button class="btn primary" id="sync">Sincronizar leads agora</button><span id="smsg" class="muted"></span></div></div></div>`;out.onclick=async()=>{await sb.auth.signOut();session=null;login()};discover.onclick=doDiscover;sync.onclick=doSync}
async function doDiscover(){dmsg.textContent='Consultando a Meta…';try{discovery=await call('connect',{access_token:token.value.trim()});assets.innerHTML=`<div class="grid" style="margin-top:16px"><div class="field"><label>Página</label><select id="page"><option value="">Selecione</option>${(discovery.pages||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.id}</option>`).join('')}</select></div><div class="field"><label>Conta de anúncios</label><select id="ad"><option value="">Selecione</option>${(discovery.ad_accounts||[]).map(x=>`<option value="${x.account_id||x.id}">${esc(x.name)} · act_${esc(x.account_id||String(x.id).replace('act_',''))}</option>`).join('')}</select></div></div><button class="btn primary" id="save" style="margin-top:14px">Validar e salvar</button>`;save.onclick=async()=>{dmsg.textContent='Validando e salvando…';try{const r=await call('connect',{access_token:token.value.trim(),app_id:appid.value.trim(),page_id:page.value,ad_account_id:ad.value});dmsg.textContent=`Conectado. ${r.forms_count} formulário(s) encontrado(s).`;dmsg.className='ok';token.value='';setTimeout(render,700)}catch(e){dmsg.textContent=e.message;dmsg.className='err'}};dmsg.textContent=`${(discovery.pages||[]).length} página(s) e ${(discovery.ad_accounts||[]).length} conta(s) encontradas.`}catch(e){dmsg.textContent=e.message;dmsg.className='err'}}
async function doSync(){smsg.textContent='Buscando formulários e leads, roteando para o CRM…';sync.disabled=true;try{const r=await call('sync',{});smsg.textContent=`Concluído: ${r.forms} formulário(s), ${r.fetched} lead(s) lido(s), ${r.queued} novo(s) enfileirado(s), ${r.crm_meta_leads} lead(s) Meta no CRM.${r.errors?.length?' Há '+r.errors.length+' alerta(s).':''}`;smsg.className=r.errors?.length?'err':'ok'}catch(e){smsg.textContent=e.message;smsg.className='err'}finally{sync.disabled=false}}
(async()=>{const {data}=await sb.auth.getSession();session=data.session;session?render():login()})();
</script></body></html>
