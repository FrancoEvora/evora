<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Évora Campaign Control</title>
  <link rel="stylesheet" href="./styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">É</div>
      <div><div class="eyebrow">ÉVORA URBANISMO</div><h1>Campaign Control</h1><p class="muted">Versão online da operação local, integrada ao Évora Enterprise.</p></div>
      <form id="loginForm" class="stack"><label>E-mail<input id="email" type="email" required autocomplete="username"/></label><label>Senha<input id="password" type="password" required autocomplete="current-password"/></label><button class="primary" type="submit">Entrar</button><div id="loginError" class="error"></div></form>
    </div>
  </div>
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand-row"><div class="brand-mark small">É</div><div><strong>Évora Campaign<br>Control</strong><span>Media Operations · Cloud</span></div></div>
      <nav id="nav">
        <button data-view="campaign" class="active">Nova campanha</button>
        <button data-view="dashboard">Dashboard</button>
        <button data-view="delivery">Central de mídia</button>
        <button data-view="history">Histórico</button>
        <button data-view="portfolio">Empreendimentos</button>
        <button data-view="forms">Formulários</button>
        <button data-view="leads">Leads</button>
        <button data-view="performance">Otimização</button>
        <button data-view="creative">Creative Intelligence</button>
        <button data-view="setup">Administração</button>
        <button data-view="reports">Relatórios técnicos</button>
      </nav>
      <div class="sidebar-bottom"><span id="orgName">—</span><span id="userEmail">—</span><button id="logoutBtn" class="ghost">Encerrar</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">MEDIA OPERATIONS</div><h2 id="viewTitle">Nova campanha</h2></div><div class="top-actions"><select id="period"><option value="7">7 dias</option><option value="14">14 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select><button id="refreshBtn" class="secondary">Atualizar</button></div></header>
      <section id="content"></section>
    </main>
  </div>
  <script src="./app.js?v=20260814-1218"></script>
  <script src="./leads-fix.js?v=20260814-1234"></script>
  <script src="./meta-local-flow.js?v=20260814-1208"></script>
  <script src="./compat.js?v=20260814-1222"></script>
</body>
</html>
